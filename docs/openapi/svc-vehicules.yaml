openapi: 3.0.3
info:
  title: svc-vehicules
  version: 1.0.0

servers:
  - url: http://svc-vehicules:3001

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Vehicule:
      type: object
      properties:
        id: { type: string, format: uuid }
        immatriculation: { type: string, example: AB-123-CD }
        marque: { type: string, example: Renault }
        modele: { type: string, example: Clio }
        annee: { type: integer, example: 2022 }
        statut:
          type: string
          enum: [disponible, en_mission, en_maintenance, hors_service]
        kilometrage: { type: number, example: 15000 }

security:
  - bearer: []

paths:
  /vehicules:
    get:
      summary: Liste tous les véhicules
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vehicule' }

    post:
      summary: Crée un véhicule (admin, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Vehicule' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicule' }

  /vehicules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }

    get:
      summary: Retourne un véhicule
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicule' }
        '404': { description: Non trouvé }

    put:
      summary: Met à jour un véhicule (admin, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Vehicule' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicule' }

    delete:
      summary: Supprime un véhicule (admin)
      responses:
        '200': { description: Supprimé }
        '404': { description: Non trouvé }
