openapi: 3.0.3
info:
  title: svc-localisation
  description: API REST de consultation des positions GPS. La reception des positions se fait via gRPC (port 50051).
  version: 1.0.0

servers:
  - url: http://svc-localisation:3004

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Position:
      type: object
      properties:
        vehicule_id: { type: string, format: uuid }
        latitude: { type: number, format: double, example: 48.8566 }
        longitude: { type: number, format: double, example: 2.3522 }
        vitesse: { type: number, description: Vitesse en km/h, example: 60.5 }
        timestamp: { type: string, format: date-time }

security:
  - bearer: []

paths:
  /localisation/dernieres:
    get:
      summary: Dernière position de chaque vehicule actif
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }

  /localisation/{vehicule_id}/historique:
    parameters:
      - { name: vehicule_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Historique des positions d'un vehicule
      parameters:
        - { name: depuis, in: query, schema: { type: string, format: date-time } }
        - { name: jusqu_a, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        '404': { description: Aucune position pour ce vehicule }

  /localisation/{vehicule_id}/derniere:
    parameters:
      - { name: vehicule_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Dernière position d'un vehicule specifique
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '404': { description: Aucune position connue }
