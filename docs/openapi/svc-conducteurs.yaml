openapi: 3.0.3
info:
  title: svc-conducteurs
  version: 1.0.0

servers:
  - url: http://svc-conducteurs:3002

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Conducteur:
      type: object
      properties:
        id: { type: string, format: uuid }
        nom: { type: string, example: Dupont }
        prenom: { type: string, example: Jean }
        email: { type: string, format: email }
        permis: { type: string, enum: [A, B, C, D, BE, CE] }
        statut: { type: string, enum: [disponible, en_mission, indisponible] }
        vehicule_id: { type: string, format: uuid, nullable: true }

security:
  - bearer: []

paths:
  /conducteurs:
    get:
      summary: Liste tous les conducteurs
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conducteur' }

    post:
      summary: Crée un conducteur (admin, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Conducteur' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conducteur' }

  /conducteurs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }

    get:
      summary: Retourne un conducteur
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conducteur' }
        '404': { description: Non trouvé }

    put:
      summary: Met à jour un conducteur (admin, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Conducteur' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conducteur' }

    delete:
      summary: Supprime un conducteur (admin)
      responses:
        '200': { description: Supprimé }

  /conducteurs/{id}/assigner-mission:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Assigne un véhicule au conducteur (admin, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicule_id]
              properties:
                vehicule_id: { type: string, format: uuid }
                destination: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conducteur' }

  /conducteurs/{id}/terminer-mission:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Termine la mission en cours (admin, manager, technicien)
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conducteur' }

  /conducteurs/{id}/echouer-mission:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Marque la mission comme echouee (admin, manager)
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conducteur' }
