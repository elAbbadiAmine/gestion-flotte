openapi: 3.0.3
info:
  title: svc-evenements
  description: Alertes generees depuis les evenements Kafka de tous les services.
  version: 1.0.0

servers:
  - url: http://svc-evenements:3005

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Alerte:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: VEHICULE_CREE }
        source_service: { type: string, example: svc-vehicules }
        message: { type: string }
        payload: { type: object }
        lu: { type: boolean, default: false }
        lu_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

security:
  - bearer: []

paths:
  /alertes:
    get:
      summary: Liste les alertes (triees par date decroissante)
      parameters:
        - { name: non_lues, in: query, schema: { type: boolean } }
        - { name: type, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alerte' }

  /alertes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }

    get:
      summary: Retourne une alerte
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alerte' }
        '404': { description: Non trouvee }

  /alertes/{id}/lu:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }

    put:
      summary: Marque une alerte comme lue
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  lu: { type: boolean, example: true }
                  lu_at: { type: string, format: date-time }
        '404': { description: Non trouvee }
