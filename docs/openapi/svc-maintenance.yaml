openapi: 3.0.3
info:
  title: svc-maintenance API
  description: Service de planification et suivi des interventions de maintenance
  version: 1.0.0

servers:
  - url: http://localhost:3003
    description: Local dev
  - url: http://svc-maintenance:3003
    description: Kubernetes interne

tags:
  - name: Interventions
    description: Gestion des interventions de maintenance
  - name: Alertes
    description: Alertes de maintenance préventive

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Maintenance:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        vehicule_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [vidange, revision, pneus, freins, autre]
          example: vidange
        description:
          type: string
          example: Vidange + filtre à huile
        statut:
          type: string
          enum: [planifiee, en_cours, terminee, annulee]
          example: planifiee
        priorite:
          type: string
          enum: [basse, normale, haute, urgente]
          example: normale
        date_prevue:
          type: string
          format: date-time
        date_debut:
          type: string
          format: date-time
          nullable: true
        date_fin:
          type: string
          format: date-time
          nullable: true
        kilometrage_prevu:
          type: number
        cout:
          type: number
          nullable: true
        rapport:
          type: string
          nullable: true

    MaintenanceInput:
      type: object
      required: [vehicule_id, type, date_prevue]
      properties:
        vehicule_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [vidange, revision, pneus, freins, autre]
        description:
          type: string
        date_prevue:
          type: string
          format: date-time
        kilometrage_prevu:
          type: number
        priorite:
          type: string
          enum: [basse, normale, haute, urgente]
          default: normale

    TerminerInput:
      type: object
      properties:
        rapport:
          type: string
        kilometrage_reel:
          type: number
        cout:
          type: number

security:
  - bearerAuth: []

paths:
  /maintenance/alertes:
    get:
      tags: [Alertes]
      summary: Liste les interventions urgentes ou en retard
      responses:
        '200':
          description: Liste des alertes maintenance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Maintenance'

  /maintenance/vehicule/{vehiculeId}:
    parameters:
      - name: vehiculeId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Interventions]
      summary: Liste les interventions d'un véhicule
      responses:
        '200':
          description: Interventions du véhicule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Maintenance'

  /maintenance:
    get:
      tags: [Interventions]
      summary: Liste toutes les interventions
      responses:
        '200':
          description: Toutes les interventions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Maintenance'

    post:
      tags: [Interventions]
      summary: Planifie une intervention
      description: Rôles requis — admin, manager, technicien
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceInput'
      responses:
        '201':
          description: Intervention planifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Maintenance'

  /maintenance/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Interventions]
      summary: Retourne une intervention par UUID
      responses:
        '200':
          description: Intervention trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Maintenance'
        '404':
          description: Intervention non trouvée

    put:
      tags: [Interventions]
      summary: Met à jour une intervention planifiée
      description: Rôles requis — admin, manager, technicien
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceInput'
      responses:
        '200':
          description: Intervention mise à jour

  /maintenance/{id}/demarrer:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Interventions]
      summary: Démarre une intervention (planifiee → en_cours)
      description: Rôles requis — admin, technicien
      responses:
        '200':
          description: Intervention démarrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Maintenance'

  /maintenance/{id}/terminer:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Interventions]
      summary: Termine une intervention (en_cours → terminee)
      description: Rôles requis — admin, technicien
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminerInput'
      responses:
        '200':
          description: Intervention terminée

  /maintenance/{id}/annuler:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Interventions]
      summary: Annule une intervention planifiée
      description: Rôles requis — admin, manager
      responses:
        '200':
          description: Intervention annulée
