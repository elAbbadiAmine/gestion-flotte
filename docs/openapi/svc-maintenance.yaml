openapi: 3.0.3
info:
  title: svc-maintenance
  version: 1.0.0

servers:
  - url: http://svc-maintenance:3003

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Maintenance:
      type: object
      properties:
        id: { type: string, format: uuid }
        vehicule_id: { type: string, format: uuid }
        type: { type: string, enum: [vidange, revision, pneus, freins, autre] }
        description: { type: string }
        statut: { type: string, enum: [planifiee, en_cours, terminee, annulee] }
        priorite: { type: string, enum: [basse, normale, haute, urgente] }
        date_prevue: { type: string, format: date-time }
        date_fin: { type: string, format: date-time, nullable: true }
        cout: { type: number, nullable: true }

security:
  - bearer: []

paths:
  /maintenance/alertes:
    get:
      summary: Liste les interventions urgentes ou en retard
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Maintenance' }

  /maintenance/vehicule/{vehiculeId}:
    parameters:
      - { name: vehiculeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Interventions d'un vehicule
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Maintenance' }

  /maintenance:
    get:
      summary: Liste toutes les interventions
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Maintenance' }

    post:
      summary: Planifie une intervention (admin, manager, technicien)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Maintenance' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }

  /maintenance/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }

    get:
      summary: Retourne une intervention
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
        '404': { description: Non trouvé }

    put:
      summary: Met à jour une intervention (admin, manager, technicien)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Maintenance' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }

  /maintenance/{id}/demarrer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Demarre une intervention, statut planifiee -> en_cours (admin, technicien)
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }

  /maintenance/{id}/terminer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Termine une intervention, statut en_cours -> terminee (admin, technicien)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rapport: { type: string }
                cout: { type: number }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }

  /maintenance/{id}/annuler:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Annule une intervention planifiee (admin, manager)
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Maintenance' }
