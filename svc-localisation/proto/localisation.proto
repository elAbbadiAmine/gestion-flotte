syntax = "proto3";

package localisation;

service LocalisationService {
  rpc EnvoyerPosition (stream PositionRequest) returns (PositionResponse);
  rpc StreamPositions (VehiculeRequest) returns (stream PositionResponse);
}

message PositionRequest {
  string vehicule_id = 1;
  double latitude    = 2;
  double longitude   = 3;
  string time        = 4;
}

message PositionResponse {
  bool   success     = 1;
  string message     = 2;
}

message VehiculeRequest {
  string vehicule_id = 1;
}
